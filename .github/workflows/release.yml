name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        type: string
      platforms:
        description: Platforms to publish in this release
        required: true
        default: all
        type: choice
        options:
          - all
          - both
          - macos
          - windows
          - linux

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release request
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Releases must be dispatched from main, got $GITHUB_REF" >&2
            exit 1
          }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "version must use X.Y.Z semantic-version form" >&2
            exit 1
          }
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag already exists: $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release already exists: $tag" >&2
            exit 1
          fi

  macos:
    needs: validate
    if: inputs.platforms == 'macos' || inputs.platforms == 'both' || inputs.platforms == 'all'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package macOS
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          chmod +x scripts/package_macos_release.sh
          scripts/package_macos_release.sh "$VERSION" "$RUNNER_TEMP/blinkrest-dist"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            ${{ runner.temp }}/blinkrest-dist/*.zip
            ${{ runner.temp }}/blinkrest-dist/*.dmg
          if-no-files-found: error
          retention-days: 3

  windows:
    needs: validate
    if: inputs.platforms == 'windows' || inputs.platforms == 'both' || inputs.platforms == 'all'
    # package_release.ps1 uses the Visual Studio 17 2022 CMake generator.
    # Pin the runner image so GitHub's moving windows-latest alias cannot
    # select an image without a discoverable VS 2022 installation.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Package Windows x64
        shell: powershell
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:RUNNER_TEMP 'blinkrest-dist'
          .\windows\tools\package_release.ps1 -Version $env:VERSION -DistDir $dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            ${{ runner.temp }}/blinkrest-dist/BlinkRest-v${{ inputs.version }}-windows-x64.zip
            ${{ runner.temp }}/blinkrest-dist/BlinkRest-v${{ inputs.version }}-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 3

  linux:
    needs: validate
    if: inputs.platforms == 'linux' || inputs.platforms == 'all'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build qt6-base-dev libgl1-mesa-dev dpkg-dev file
      - name: Package Linux
        env:
          VERSION: ${{ inputs.version }}
        run: |
          linux/tools/package_release.sh "$VERSION" "$RUNNER_TEMP/blinkrest-dist"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/blinkrest-dist/BlinkRest-v${{ inputs.version }}-linux-${{ matrix.arch }}.deb
            ${{ runner.temp }}/blinkrest-dist/BlinkRest-v${{ inputs.version }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  release:
    needs:
      - validate
      - macos
      - windows
      - linux
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download macOS assets
        if: inputs.platforms == 'macos' || inputs.platforms == 'both' || inputs.platforms == 'all'
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: dist
      - name: Download Windows asset
        if: inputs.platforms == 'windows' || inputs.platforms == 'both' || inputs.platforms == 'all'
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist
      - name: Download Linux assets
        if: inputs.platforms == 'linux' || inputs.platforms == 'all'
        uses: actions/download-artifact@v4
        with:
          pattern: release-linux-*
          merge-multiple: true
          path: dist
      - name: Verify asset contract and checksums
        env:
          VERSION: ${{ inputs.version }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if [[ "$PLATFORMS" == "macos" || "$PLATFORMS" == "both" || "$PLATFORMS" == "all" ]]; then
            test -f "dist/BlinkRest-$tag-macos-arm64.zip"
            test -f "dist/BlinkRest-$tag-macos-x86_64.zip"
            test -f "dist/BlinkRest-$tag-macos-arm64.dmg"
            test -f "dist/BlinkRest-$tag-macos-x86_64.dmg"
          fi
          if [[ "$PLATFORMS" == "windows" || "$PLATFORMS" == "both" || "$PLATFORMS" == "all" ]]; then
            test -f "dist/BlinkRest-$tag-windows-x64.zip"
            test -f "dist/BlinkRest-$tag-windows-x64-setup.exe"
          fi
          if [[ "$PLATFORMS" == "linux" || "$PLATFORMS" == "all" ]]; then
            for arch in amd64 arm64; do
              test -f "dist/BlinkRest-$tag-linux-$arch.deb"
              test -f "dist/BlinkRest-$tag-linux-$arch.tar.gz"
            done
          fi
          find dist -maxdepth 1 -type f \( -name 'BlinkRest-*.zip' -o -name 'BlinkRest-*.dmg' -o -name 'BlinkRest-*-setup.exe' -o -name 'BlinkRest-*.tar.gz' -o -name 'BlinkRest-*.deb' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  dist/#  #' > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$tag" -m "Blink Rest $VERSION"
          git push origin "$tag"
          gh release create "$tag" dist/* \
            --verify-tag \
            --title "Blink Rest $VERSION" \
            --generate-notes
